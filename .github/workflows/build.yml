name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pipx
        run: |
          python3 -m pip install --user pipx
          python3 -m pipx ensurepath
        shell: bash
      - name: Install jsonschema
        run: pipx install check-jsonschema
      - name: Validate Materials
        run: check-jsonschema --schemafile materials.schema.json materials.json
      - name: Validate Filaments
        run: check-jsonschema --schemafile filaments.schema.json filaments/*
  compile:
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Compile filaments
        run: python3 scripts/compile_filaments.py
      - name: Commit updated artifacts
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f filaments.json
          git add materials.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: regenerate compiled filament database [skip ci]"
            git push
          fi

  # Single deploy job since we're just deploying
  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    needs: [compile]
    concurrency:
      group: "pages"
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Compile filaments
        run: python3 scripts/compile_filaments.py
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Copy generated data
        run: |
          cp filaments.json public/
          cp materials.json public/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
